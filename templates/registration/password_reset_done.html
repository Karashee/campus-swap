{% extends 'base.html' %}
{% block title %}Reset link sent{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-card card">
    <h1>Check your email</h1>
    <p>If an account exists for that address, a reset link is on its way.</p>
    <p class="help">In development the email is printed in the terminal running the server.</p>
    <a class="btn" href="{% url 'accounts:login' %}">Back to log in</a>
  </div>
</div>
{% endblock %}
