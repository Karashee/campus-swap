{# Renders one bound form field: label, widget, help text, errors. #}
<div class="field">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}
  <ul class="errorlist">
    {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
  {% endif %}
</div>
