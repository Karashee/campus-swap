{# One listing in a grid. Expects `listing`. #}
<a class="card card-link listing-card" href="{{ listing.get_absolute_url }}">
  <div class="listing-card-image">
    <img src="{{ listing.image.url }}" alt="{{ listing.title }}" loading="lazy">
    {% if not listing.is_available %}
    <span class="status-overlay">{{ listing.get_status_display|upper }}</span>
    {% endif %}
  </div>

  <p class="listing-card-tag">
    <span class="tag{% if listing.listing_type == 'FREE' %} tag-free{% elif listing.listing_type == 'TRADE' %} tag-trade{% endif %}">
      {{ listing.display_price }}
    </span>
  </p>

  <strong class="listing-card-title{% if listing.status == 'SOLD' %} struck{% endif %}">
    {{ listing.title }}
  </strong>
  <span class="help">{{ listing.get_condition_display }} · {{ listing.category }}</span>
</a>
